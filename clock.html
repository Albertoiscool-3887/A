<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock - Multiple Time Zones</title>
    <link rel="stylesheet" href="css/clock-styles.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <h1>⏰ Digital Clock</h1>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Shop</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="clock.html" class="active">Clock</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Clock Section -->
    <div class="clock-container">
        <div class="main-clock-section">
            <h2>Current Time</h2>
            <div class="main-clock">
                <div class="time-display" id="main-time">00:00:00</div>
                <div class="date-display" id="main-date">Loading...</div>
            </div>
        </div>

        <!-- Controls Section -->
        <div class="controls-section">
            <div class="control-group">
                <label for="timezone-select">Add Time Zone:</label>
                <select id="timezone-select">
                    <option value="">-- Select a Time Zone --</option>
                    <option value="UTC">UTC (Coordinated Universal Time)</option>
                    <option value="America/New_York">EST (New York)</option>
                    <option value="America/Chicago">CST (Chicago)</option>
                    <option value="America/Denver">MST (Denver)</option>
                    <option value="America/Los_Angeles">PST (Los Angeles)</option>
                    <option value="America/Anchorage">AKST (Anchorage)</option>
                    <option value="Pacific/Honolulu">HST (Honolulu)</option>
                    <option value="Europe/London">GMT (London)</option>
                    <option value="Europe/Paris">CET (Paris)</option>
                    <option value="Europe/Moscow">MSK (Moscow)</option>
                    <option value="Asia/Dubai">GST (Dubai)</option>
                    <option value="Asia/Kolkata">IST (India)</option>
                    <option value="Asia/Bangkok">ICT (Bangkok)</option>
                    <option value="Asia/Shanghai">CST (China)</option>
                    <option value="Asia/Tokyo">JST (Tokyo)</option>
                    <option value="Asia/Seoul">KST (Seoul)</option>
                    <option value="Asia/Hong_Kong">HKT (Hong Kong)</option>
                    <option value="Australia/Sydney">AEDT (Sydney)</option>
                    <option value="Australia/Melbourne">AEDT (Melbourne)</option>
                    <option value="New_Zealand">NZDT (Auckland)</option>
                </select>
                <button id="add-timezone-btn" class="btn btn-primary">Add Time Zone</button>
            </div>

            <div class="format-group">
                <label>
                    <input type="radio" name="format" value="12" checked>
                    12-Hour Format
                </label>
                <label>
                    <input type="radio" name="format" value="24">
                    24-Hour Format
                </label>
            </div>
        </div>
    </div>

    <!-- Time Zones Grid -->
    <div class="timezones-container">
        <h2>Time Zones</h2>
        <div id="timezone-clocks" class="timezone-grid">
            <!-- Timezone clocks will be added here dynamically -->
        </div>
        <div id="no-zones-message" class="no-zones-message">
            <p>No time zones added yet. Select a time zone above to get started!</p>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 Digital Clock. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/clock.js"></script>
</body>
</html>
